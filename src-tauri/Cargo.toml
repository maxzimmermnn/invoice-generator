[package]
name = "invoice-generator"
version = "0.0.0" # real version comes from ../package.json via tauri.conf.json
description = "ZUGFeRD / Factur-X invoice generator — desktop shell"
edition = "2021"
publish = false

[lib]
name = "invoice_generator_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
