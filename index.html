<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Invoice Generator · ZUGFeRD / Factur-X</title>
<meta name="description" content="Free offline ZUGFeRD / Factur-X invoice generator. Runs in the browser, no server, no account.">
<meta property="og:title" content="E-Invoice Generator">
<meta property="og:description" content="Free offline ZUGFeRD / Factur-X invoice generator.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/src/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>€</text></svg>">
<script>
  // Instant theme application (before paint) — prevents flash of wrong theme
  (function() {
    var pref = localStorage.getItem('erechnung:theme:v1') || localStorage.getItem('erechnung:theme');
    var isDark = pref === 'dark' || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>

<noscript style="display:block; padding:20px; background:#fdd; color:#900;">
  This tool requires JavaScript. Please enable it.
</noscript>

<div class="app-shell">
<div class="app-card" id="appCard">

<!-- ===== Left column: form ===== -->
<div class="form-col wrap">

  <header class="app-head">
    <h1 data-i18n="title">E-Invoice Generator</h1>
    <div class="head-actions">
      <button id="duplicateLast" class="btn-sm" type="button" data-i18n-title="btn_duplicate_last">
        <span data-i18n="btn_duplicate_short"></span> <kbd class="kbd-hint">⌘D</kbd>
      </button>
      <button id="openHistory" class="btn-sm" type="button" data-i18n="label_history"></button>
      <button id="openStats" class="btn-sm" type="button" data-i18n="label_stats"></button>
      <button id="previewToggle" class="btn-icon preview-toggle" type="button"
              aria-pressed="true" data-i18n-title="aria_preview_toggle" data-i18n-aria-label="aria_preview_toggle">◎</button>
      <button id="overflowToggle" class="btn-icon" type="button" aria-haspopup="true" aria-expanded="false" aria-label="More">⋯</button>

      <div class="overflow-menu" id="overflowMenu" hidden>
        <div class="menu-caption" data-i18n="menu_ui_language"></div>
        <div class="segmented" id="langSegment">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="fr">FR</button>
        </div>
        <div class="menu-caption menu-caption-divided" data-i18n="menu_theme"></div>
        <div class="segmented" id="themeSegment">
          <button type="button" data-theme-pref="light" data-i18n="seg_light"></button>
          <button type="button" data-theme-pref="dark" data-i18n="seg_dark"></button>
          <button type="button" data-theme-pref="auto" data-i18n="seg_auto"></button>
        </div>
        <button id="openHelp" class="menu-item menu-item-divided" type="button" data-i18n="menu_help"></button>
        <button id="openBackup" class="menu-item" type="button" data-i18n="menu_backup"></button>
        <button id="rerunSetup" class="menu-item" type="button" data-i18n="menu_rerun_setup"></button>
      </div>
    </div>
  </header>

  <!-- Seller identity chip + dropdown -->
  <div class="seller-row">
    <button id="sellerChip" class="seller-chip" type="button" aria-haspopup="true" aria-expanded="false">
      <span class="avatar" id="sellerAvatar" aria-hidden="true">–</span>
      <span class="seller-chip-label" id="sellerChipLabel"></span>
      <span class="caret" aria-hidden="true">⌄</span>
    </button>

    <div class="seller-menu" id="sellerMenu" hidden>
      <!-- Read mode -->
      <div id="sellerRead">
        <div class="seller-menu-head">
          <span class="avatar avatar-lg" id="sellerAvatarLg" aria-hidden="true">–</span>
          <div>
            <div class="seller-menu-name" id="sellerReadName"></div>
            <div class="seller-menu-name2" id="sellerReadName2" hidden></div>
            <div class="seller-menu-caption" data-i18n="seller_profile_caption"></div>
          </div>
        </div>
        <div class="seller-kv">
          <div><span data-i18n="f_vat_short"></span><b id="sellerReadVat"></b></div>
          <div><span data-i18n="f_country"></span><b id="sellerReadCountry"></b></div>
          <div><span data-i18n="f_email"></span><b id="sellerReadEmail"></b></div>
          <div><span data-i18n="f_phone"></span><b id="sellerReadPhone"></b></div>
          <div><span data-i18n="f_iban"></span><b id="sellerReadIban"></b></div>
          <div><span data-i18n="f_bic"></span><b id="sellerReadBic"></b></div>
        </div>
        <div class="seller-menu-actions">
          <button id="sellerEditBtn" class="btn-accent-soft" type="button" data-i18n="btn_edit"></button>
          <button id="sellerRerunBtn" class="btn-panel" type="button" data-i18n="btn_rerun_setup"></button>
        </div>
      </div>

      <!-- Edit mode: the s_* inputs live here permanently (the PDF/XML
           pipeline reads them by id, so they must always be in the DOM). -->
      <div id="sellerEdit" hidden>
        <div class="seller-menu-name" data-i18n="seller_edit_title"></div>
        <div class="menu-grid">
          <label class="full"><span data-i18n="f_company"></span>
            <input type="text" id="s_name" autocomplete="off">
          </label>
          <label class="full"><span data-i18n="f_company2"></span>
            <input type="text" id="s_name2" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_vat_short"></span>
            <input type="text" id="s_vat" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_country"></span>
            <input type="text" id="s_country" value="DE" maxlength="3" autocomplete="off">
          </label>
          <label class="full"><span data-i18n="f_address"></span>
            <input type="text" id="s_line1" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_zip"></span>
            <input type="text" id="s_zip" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_city"></span>
            <input type="text" id="s_city" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_email"></span>
            <input type="email" id="s_email" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_phone"></span>
            <input type="text" id="s_phone" autocomplete="off">
          </label>
          <label class="half wide">
            <span class="label-with-tip">
              <span data-i18n="f_iban"></span>
              <button type="button" class="tooltip-btn" data-tip-key="tip_iban" data-i18n-aria-label="aria_tooltip_open">?</button>
            </span>
            <input type="text" id="s_iban" autocomplete="off">
          </label>
          <label class="half narrow"><span data-i18n="f_bic"></span>
            <input type="text" id="s_bic" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_bank"></span>
            <input type="text" id="s_bank" autocomplete="off">
          </label>
          <label class="half"><span data-i18n="f_siret"></span>
            <input type="text" id="s_siret" autocomplete="off" data-i18n-placeholder="f_siret_placeholder">
          </label>
        </div>
        <div class="seller-menu-actions right">
          <button id="sellerCancelBtn" class="btn-outline" type="button" data-i18n="btn_cancel"></button>
          <button id="saveSeller" class="btn-accent" type="button" data-i18n="btn_save"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="buyer" data-i18n="tab_buyer"></button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="items" data-i18n="tab_items"></button>
    <button class="tab" type="button" role="tab" aria-selected="false" data-tab="details" data-i18n="tab_details"></button>
  </nav>

  <div class="tab-panels">

    <!-- ===== BUYER TAB ===== -->
    <section class="tab-panel" id="tab-buyer" role="tabpanel">
      <div class="panel-inner narrow-panel">
        <div class="field-stack">
          <label class="mini-label" data-i18n="recent_customers"></label>
          <div class="chip-row" id="recentCustomers"></div>
        </div>

        <select id="buyerPicker" class="select-box" aria-label="Buyer profile">
          <option value="" data-i18n="f_buyer_picker"></option>
        </select>

        <div class="info-banner" id="buyerHistoryHint" hidden></div>

        <label class="u-field"><span data-i18n="f_company"></span>
          <input type="text" id="b_name" list="buyerNamesMemory" autocomplete="off" data-i18n-placeholder="buyer_name_placeholder">
          <datalist id="buyerNamesMemory"></datalist>
        </label>
        <label class="u-field"><span data-i18n="f_address"></span>
          <input type="text" id="b_line1">
        </label>
        <div class="field-cols">
          <label class="u-field col-1"><span data-i18n="f_zip"></span>
            <input type="text" id="b_zip">
          </label>
          <label class="u-field col-2"><span data-i18n="f_city"></span>
            <input type="text" id="b_city">
          </label>
        </div>
        <div class="field-cols">
          <label class="u-field col-1"><span data-i18n="f_country"></span>
            <input type="text" id="b_country" value="FR" maxlength="3">
          </label>
          <label class="u-field col-2"><span data-i18n="f_vat_b2b"></span>
            <input type="text" id="b_vat">
          </label>
        </div>

        <details class="more-details">
          <summary data-i18n="buyer_more_summary"></summary>
          <div class="more-body">
            <label class="u-field"><span data-i18n="f_company2"></span>
              <input type="text" id="b_name2" autocomplete="off">
            </label>
            <div class="field-cols">
              <label class="u-field col-1"><span data-i18n="f_siret"></span>
                <input type="text" id="b_siret" data-i18n-placeholder="f_siret_placeholder">
              </label>
              <label class="u-field col-1"><span data-i18n="f_buyer_reference"></span>
                <input type="text" id="b_reference" data-i18n-placeholder="f_buyer_reference_placeholder">
              </label>
            </div>
          </div>
        </details>

        <div class="buyer-actions">
          <button id="saveBuyer" class="btn-accent-soft" type="button" data-i18n="btn_save_customer"></button>
          <button id="deleteBuyer" class="btn-outline btn-faint" type="button" data-i18n="btn_delete" hidden></button>
          <div id="buyerDeleteConfirm" class="confirm-inline" hidden>
            <span data-i18n="confirm_delete_customer"></span>
            <button id="buyerDeleteYes" class="link-accent" type="button" data-i18n="confirm_yes"></button>
            <button id="buyerDeleteNo" class="link-muted" type="button" data-i18n="confirm_no"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== ITEMS TAB ===== -->
    <section class="tab-panel" id="tab-items" role="tabpanel" hidden>
      <div class="panel-inner">
        <div class="items-head" id="itemsHead">
          <div data-i18n="th_desc"></div>
          <div data-i18n="th_price"></div>
          <div data-i18n="th_qty"></div>
          <div data-i18n="th_vat_pct"></div>
          <div data-i18n="th_total"></div>
          <div></div>
        </div>

        <div class="items-empty" id="itemsEmpty" hidden>
          <div data-i18n="items_empty_hint"></div>
          <button type="button" id="addFirstLine" class="btn-accent-soft" data-i18n="btn_add_first_line"></button>
        </div>

        <div class="items" id="items"></div>

        <div class="totals-block">
          <div id="vatRows"></div>
          <div class="totals-row"><span id="t_tax_label">VAT</span><span id="t_tax">0,00</span></div>
          <div class="totals-row grand"><span data-i18n="total_grand"></span><span id="t_total">0,00</span></div>
        </div>

        <div class="warn-banner" id="taxNoteBox" hidden><span id="taxNote"></span></div>

        <button type="button" class="btn-accent-soft add-line" id="addItem" data-i18n="btn_add_item"></button>
      </div>
    </section>

    <!-- ===== INVOICE INFO TAB ===== -->
    <section class="tab-panel" id="tab-details" role="tabpanel" hidden>
      <div class="panel-inner narrow-panel">

        <!-- 1. Numbering & dates (always open) -->
        <div class="info-section">
          <div class="section-caption" data-i18n="sec_numbering"></div>
          <div class="field-cols">
            <label class="u-field col-1"><span data-i18n="f_number"></span>
              <input type="text" id="r_number">
            </label>
            <label class="u-field col-1"><span data-i18n="f_date"></span>
              <input type="date" id="r_date">
            </label>
          </div>
          <div class="number-pattern-row">
            <button type="button" class="chip-btn" id="suggestNumber"></button>
            <button type="button" class="link-muted" id="numberPatternToggle" data-i18n="f_number_pattern_summary"></button>
          </div>
          <div class="number-pattern-body" id="numberPatternBody" hidden>
            <div class="inline-row">
              <input type="text" id="r_number_pattern" placeholder="{yyyy}-{counter:5}">
              <button type="button" class="btn-sm" id="saveNumberPattern" data-i18n="btn_save_pattern"></button>
            </div>
            <div class="token-chips" id="numberPatternChips">
              <button type="button" data-token="{yyyy}">{yyyy}</button>
              <button type="button" data-token="{yy}">{yy}</button>
              <button type="button" data-token="{mm}">{mm}</button>
              <button type="button" data-token="{dd}">{dd}</button>
              <button type="button" data-token="{counter}">{counter}</button>
              <button type="button" data-token="{counter:3}">{counter:3}</button>
              <button type="button" data-token="{counter:5}">{counter:5}</button>
            </div>
            <p class="note-small" data-i18n="f_number_pattern_hint"></p>
          </div>

          <div class="field-stack">
            <label class="mini-label" data-i18n="f_due"></label>
            <div class="due-row">
              <div class="due-chips" id="dueChips">
                <button type="button" data-days="14">+14d</button>
                <button type="button" data-days="30">+30d</button>
                <button type="button" data-days="60">+60d</button>
                <button type="button" data-days="90">+90d</button>
              </div>
              <span class="due-display" id="dueDateDisplay"></span>
            </div>
            <input type="date" id="r_due" class="visually-hidden" tabindex="-1" aria-hidden="true">
          </div>

          <div class="field-stack">
            <label class="mini-label">
              <span class="label-with-tip">
                <span data-i18n="f_delivery"></span>
                <button type="button" class="tooltip-btn" data-tip-key="tip_delivery" data-i18n-aria-label="aria_tooltip_open">?</button>
              </span>
            </label>
            <div class="delivery-row">
              <input type="date" id="r_delivery" class="u-input">
              <span class="delivery-arrow" id="deliveryArrow" hidden>→</span>
              <input type="date" id="r_delivery_end" class="u-input" hidden>
              <button type="button" class="link-faint" id="clearDeliveryEnd" data-i18n-title="btn_remove_period" hidden>✕</button>
              <button type="button" class="link-accent" id="addDeliveryEnd" data-i18n="btn_make_period"></button>
            </div>
          </div>
        </div>

        <!-- 2. Project & Category -->
        <details class="info-details" open>
          <summary class="section-caption" data-i18n="sec_project_category"></summary>
          <div class="details-body">
            <div class="field-cols">
              <label class="u-field col-1"><span data-i18n="f_project"></span>
                <input type="text" id="r_project" data-i18n-placeholder="f_project_placeholder">
              </label>
              <label class="u-field col-1"><span data-i18n="f_category"></span>
                <input type="text" id="r_category" data-i18n-placeholder="f_category_placeholder">
              </label>
            </div>
          </div>
        </details>

        <!-- 3. Text blocks (preset system) -->
        <details class="info-details" open>
          <summary class="section-caption" data-i18n="sec_text_blocks"></summary>
          <div class="details-body text-blocks">

            <div class="text-block" data-block="intro">
              <div class="text-block-head">
                <label class="mini-label" data-i18n="f_intro"></label>
                <div class="text-block-preset">
                  <select id="presetSelect_intro" class="select-sm"></select>
                  <button type="button" class="link-faint preset-delete" id="presetDelete_intro" data-i18n-title="preset_delete_title">✕</button>
                </div>
              </div>
              <textarea id="r_intro" rows="2" data-i18n-placeholder="f_intro_placeholder"></textarea>
              <div class="preset-save-row" id="presetSaveRow_intro" hidden>
                <button type="button" class="link-accent preset-save-link" id="presetSaveLink_intro" data-i18n="preset_save_as"></button>
                <div class="preset-naming" id="presetNaming_intro" hidden>
                  <input type="text" id="presetName_intro" data-i18n-placeholder="preset_name_placeholder">
                  <button type="button" class="btn-accent btn-xs" id="presetNameSave_intro" data-i18n="btn_save"></button>
                  <button type="button" class="link-muted" id="presetNameCancel_intro" data-i18n="btn_cancel"></button>
                </div>
              </div>
            </div>

            <div class="text-block" data-block="paymentNote">
              <div class="text-block-head">
                <label class="mini-label" data-i18n="f_payment_note"></label>
                <div class="text-block-preset">
                  <select id="presetSelect_paymentNote" class="select-sm"></select>
                  <button type="button" class="link-faint preset-delete" id="presetDelete_paymentNote" data-i18n-title="preset_delete_title">✕</button>
                </div>
              </div>
              <textarea id="r_payment_note" rows="2" data-i18n-placeholder="f_payment_note_placeholder"></textarea>
              <div class="preset-save-row" id="presetSaveRow_paymentNote" hidden>
                <button type="button" class="link-accent preset-save-link" id="presetSaveLink_paymentNote" data-i18n="preset_save_as"></button>
                <div class="preset-naming" id="presetNaming_paymentNote" hidden>
                  <input type="text" id="presetName_paymentNote" data-i18n-placeholder="preset_name_placeholder">
                  <button type="button" class="btn-accent btn-xs" id="presetNameSave_paymentNote" data-i18n="btn_save"></button>
                  <button type="button" class="link-muted" id="presetNameCancel_paymentNote" data-i18n="btn_cancel"></button>
                </div>
              </div>
            </div>

            <div class="text-block" data-block="footnote">
              <div class="text-block-head">
                <label class="mini-label" data-i18n="f_footnote"></label>
                <div class="text-block-preset">
                  <select id="presetSelect_footnote" class="select-sm"></select>
                  <button type="button" class="link-faint preset-delete" id="presetDelete_footnote" data-i18n-title="preset_delete_title">✕</button>
                </div>
              </div>
              <textarea id="r_footnote" rows="2" data-i18n-placeholder="f_footnote_placeholder"></textarea>
              <div class="preset-save-row" id="presetSaveRow_footnote" hidden>
                <button type="button" class="link-accent preset-save-link" id="presetSaveLink_footnote" data-i18n="preset_save_as"></button>
                <div class="preset-naming" id="presetNaming_footnote" hidden>
                  <input type="text" id="presetName_footnote" data-i18n-placeholder="preset_name_placeholder">
                  <button type="button" class="btn-accent btn-xs" id="presetNameSave_footnote" data-i18n="btn_save"></button>
                  <button type="button" class="link-muted" id="presetNameCancel_footnote" data-i18n="btn_cancel"></button>
                </div>
              </div>
            </div>

            <div class="field-cols">
              <label class="u-field col-1"><span data-i18n="f_greeting"></span>
                <input type="text" id="r_greeting" data-i18n-placeholder="f_greeting_placeholder">
              </label>
              <label class="u-field col-1"><span data-i18n="f_signature"></span>
                <input type="text" id="r_signature" data-i18n-placeholder="f_signature_placeholder">
              </label>
            </div>
            <div class="text-block">
              <label class="mini-label" data-i18n="f_note"></label>
              <textarea id="r_note" rows="2"></textarea>
            </div>
          </div>
        </details>

        <!-- 4. Currency & Tax -->
        <details class="info-details">
          <summary class="section-caption"><span data-i18n="sec_currency_tax"></span><span class="summary-value" id="currencySummary"></span></summary>
          <div class="details-body">
            <div class="field-cols">
              <label class="s-field col-1"><span data-i18n="f_currency"></span>
                <select id="r_currency" class="select-box">
                  <option value="EUR">EUR €</option>
                  <option value="USD">USD $</option>
                  <option value="GBP">GBP £</option>
                  <option value="CHF">CHF</option>
                </select>
              </label>
              <label class="s-field col-1"><span data-i18n="f_invoice_lang"></span>
                <select id="invoiceLangSelect" class="select-box">
                  <option value="" data-i18n="invoice_lang_auto"></option>
                  <option value="en">English</option>
                  <option value="de">Deutsch</option>
                  <option value="fr">Français</option>
                </select>
              </label>
            </div>
            <label class="s-field">
              <span class="label-with-tip">
                <span data-i18n="f_taxmode"></span>
                <button type="button" class="tooltip-btn" data-tip-key="tip_taxmode" data-i18n-aria-label="aria_tooltip_open">?</button>
              </span>
              <select id="r_taxmode" class="select-box">
                <option value="S" data-i18n="tax_S"></option>
                <option value="AE" selected data-i18n="tax_AE"></option>
                <option value="Z" data-i18n="tax_Z"></option>
                <option value="E" data-i18n="tax_E"></option>
                <option value="O" data-i18n="tax_O"></option>
              </select>
            </label>
          </div>
        </details>

        <!-- 5. Layout -->
        <details class="info-details">
          <summary class="section-caption"><span data-i18n="sec_layout"></span><span class="summary-value" id="layoutSummary"></span></summary>
          <div class="details-body">
            <div class="layout-segment" id="layoutSegment"></div>
            <select id="invoiceLayoutSelect" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
            <label class="s-field"><span data-i18n="f_invoice_font"></span>
              <select id="invoiceFontSelect" class="select-box">
                <option value="courier-prime">Courier Prime</option>
                <option value="ibm-plex-mono">IBM Plex Mono</option>
                <option value="jetbrains-mono">JetBrains Mono</option>
                <option value="inconsolata">Inconsolata</option>
                <option value="space-mono">Space Mono</option>
              </select>
            </label>
          </div>
        </details>

        <!-- 6. Filename pattern -->
        <details class="info-details">
          <summary class="section-caption" data-i18n="sec_filename"></summary>
          <div class="details-body">
            <label class="s-field"><span data-i18n="f_filename_pattern"></span>
              <input type="text" id="r_filename" class="input-box" placeholder="{nr}_{buyer}_{project}" value="{nr}_{buyer}_{project}">
            </label>
            <div class="token-chip-row">
              <span class="note-small" data-i18n="filename_insert_label"></span>
              <div class="token-chips" id="filenameChips">
                <button type="button" data-token="{nr}">{nr}</button>
                <button type="button" data-token="{buyer}">{buyer}</button>
                <button type="button" data-token="{project}">{project}</button>
                <button type="button" data-token="{date}">{date}</button>
                <button type="button" data-token="{category}">{category}</button>
                <button type="button" data-token="{seller}">{seller}</button>
                <button type="button" data-token="{layout}">{layout}</button>
              </div>
            </div>
            <div class="filename-preview" id="filenamePreview"></div>
          </div>
        </details>

      </div>
    </section>
  </div>

  <!-- Sticky action bar -->
  <div class="action-bar">
    <button type="button" class="btn-primary" id="btnPDF"><span data-i18n="btn_create_pdf"></span> <kbd class="kbd-hint">⌘↵</kbd></button>
    <button type="button" class="btn-outline" id="btnXML" data-i18n="btn_xml_only"></button>
    <button type="button" class="btn-outline" id="btnValidate" data-i18n="btn_validate"></button>
    <button type="button" class="btn-outline" id="btnEmbed" data-i18n="btn_embed_xml"></button>

    <div class="validate-popover" id="validatePopover" hidden></div>
  </div>

</div><!-- /.form-col -->

<!-- ===== Right column: live PDF preview ===== -->
<aside class="preview-col" id="previewPane">
  <div class="preview-head">
    <span data-i18n="preview_title"></span>
    <span class="preview-status" id="previewStatus" hidden data-i18n="preview_updating"></span>
  </div>
  <div class="preview-card">
    <div class="preview-empty" id="previewEmpty" data-i18n="preview_empty"></div>
    <iframe class="preview-frame" id="previewFrame" title="Invoice preview" hidden></iframe>
  </div>
</aside>

</div><!-- /.app-card -->
</div><!-- /.app-shell -->

<!-- ===== Stats modal ===== -->
<div class="modal" id="statsModal" hidden>
  <div class="modal-content stats-modal-content">
    <div class="modal-head">
      <h2 data-i18n="stats_title"></h2>
      <button id="statsClose" class="modal-x" type="button" aria-label="Close">✕</button>
    </div>

    <div class="modal-controls stats-controls">
      <div class="stats-tabs">
        <button id="statsTabOverview" class="stats-tab active" type="button" data-i18n="stats_tab_overview"></button>
        <button id="statsTabQuarters" class="stats-tab" type="button" data-i18n="stats_tab_quarters"></button>
      </div>
      <div class="stats-controls-right">
        <label class="inline" id="statsPeriodWrap">
          <select id="statsPeriod" class="select-sm">
            <option value="ytd" selected data-i18n="stats_period_ytd"></option>
            <option value="last12" data-i18n="stats_period_last12"></option>
            <option value="last6" data-i18n="stats_period_last6"></option>
            <option value="last3" data-i18n="stats_period_last3"></option>
            <option value="last_month" data-i18n="stats_period_last_month"></option>
            <option value="all" data-i18n="stats_period_all"></option>
            <option value="last_year" data-i18n="stats_period_last_year"></option>
          </select>
        </label>
        <label class="inline" id="statsYearWrap" style="display: none;">
          <span data-i18n="stats_year_label"></span>
          <select id="statsYear" class="select-sm"></select>
        </label>
        <button id="statsYoYToggle" class="btn-sm" type="button" data-i18n="btn_yoy_toggle" aria-pressed="false"></button>
        <button id="yoyBackfillOpen" class="btn-sm" type="button" data-i18n="yoy_set_reference"></button>
        <button id="statsExportCsv" class="btn-sm" type="button" data-i18n="btn_export_csv"></button>
      </div>
    </div>

    <div id="statsBody" class="stats-body">
      <!-- Filled by renderStatistics() -->
    </div>
  </div>
</div>

<!-- ===== History modal ===== -->
<div class="modal" id="historyModal" hidden>
  <div class="modal-content history-modal-content">
    <div class="modal-head">
      <div>
        <h2 data-i18n="section_history"></h2>
        <div class="modal-subcaption" id="historyCount"></div>
      </div>
      <div class="modal-head-actions">
        <label class="switch-label">
          <span data-i18n="history_autosave"></span>
          <span class="switch">
            <input type="checkbox" id="historyEnable">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
          </span>
        </label>
        <button id="historyClose" class="modal-x" type="button" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="history-filter-row">
      <input type="search" id="historySearch" data-i18n-placeholder="history_search_placeholder" autocomplete="off">
      <select id="historyPeriod" class="select-sm" aria-label="Period">
        <option value="all" selected data-i18n="stats_period_all"></option>
        <option value="ytd" data-i18n="stats_period_ytd"></option>
        <option value="last12" data-i18n="stats_period_last12"></option>
        <option value="last6" data-i18n="stats_period_last6"></option>
        <option value="last3" data-i18n="stats_period_last3"></option>
        <option value="last_month" data-i18n="stats_period_last_month"></option>
        <option value="last_year" data-i18n="stats_period_last_year"></option>
      </select>
    </div>

    <div class="history-table">
      <div class="history-table-head">
        <div data-i18n="th_number"></div>
        <div data-i18n="th_buyer"></div>
        <div data-i18n="th_date"></div>
        <div data-i18n="th_total_col"></div>
        <div></div>
      </div>
      <ul id="historyList" class="history-list" role="list"></ul>
    </div>

    <div class="history-bottom-row">
      <button class="btn-outline" id="historyAddPast" type="button" data-i18n="btn_history_add_past"></button>
      <div class="history-clear-wrap">
        <button class="link-faint" id="historyClearAll" type="button" data-i18n="btn_history_clear_all"></button>
        <div class="confirm-inline" id="historyClearConfirm" hidden>
          <span id="historyClearConfirmLabel"></span>
          <button id="historyClearYes" class="link-accent" type="button" data-i18n="btn_yes_clear"></button>
          <button id="historyClearNo" class="link-muted" type="button" data-i18n="btn_cancel"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Help modal (two-pane) ===== -->
<div class="modal" id="helpModal" hidden>
  <div class="modal-content help-modal-content">
    <div class="help-sidebar">
      <div class="help-sidebar-title" data-i18n="help_title"></div>
      <input type="search" id="helpSearch" data-i18n-placeholder="help_search_placeholder" autocomplete="off">
      <div id="helpTopics" class="help-topics"></div>
      <div id="helpNoResults" class="help-no-results" data-i18n="help_no_results" hidden></div>
    </div>
    <div class="help-content">
      <div class="help-content-head">
        <h2 id="helpTopicTitle"></h2>
        <button id="helpClose" class="modal-x" type="button" aria-label="Close">✕</button>
      </div>
      <div id="helpBody" class="help-body"></div>
    </div>
  </div>
</div>

<!-- ===== Backup & restore modal ===== -->
<div class="modal" id="backupModal" hidden>
  <div class="modal-content backup-modal-content">
    <div class="modal-head">
      <h2 data-i18n="backup_title"></h2>
      <button id="backupClose" class="modal-x" type="button" aria-label="Close">✕</button>
    </div>

    <div class="backup-section">
      <div class="backup-section-title" data-i18n="backup_export_head"></div>
      <p class="backup-section-body" id="backupExportSummary"></p>
      <button type="button" class="btn-accent" id="btnExport" data-i18n="btn_download_backup"></button>
    </div>

    <div class="backup-section">
      <div class="backup-section-title" data-i18n="backup_import_head"></div>
      <p class="backup-section-body" data-i18n="backup_import_body"></p>

      <label class="backup-drop" id="backupDropLabel">
        <span data-i18n="backup_choose_file"></span>
        <input type="file" id="importFile" accept="application/json,.json" class="visually-hidden">
      </label>
      <button type="button" id="btnImport" class="visually-hidden" tabindex="-1" aria-hidden="true"></button>

      <div class="warn-banner" id="backupImportError" hidden></div>

      <div class="backup-pending" id="backupPending" hidden>
        <div class="backup-pending-title" data-i18n="backup_ready"></div>
        <div id="backupPendingSummary"></div>
        <div class="backup-pending-warnings" id="backupPendingWarnings" hidden></div>
        <div class="backup-pending-actions">
          <button type="button" class="btn-outline" id="backupCancelImport" data-i18n="btn_cancel"></button>
          <button type="button" class="btn-accent" id="backupConfirmImport" data-i18n="backup_restore"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Onboarding modal (first-run setup) ===== -->
<div class="modal onboarding-modal" id="onboardingModal" hidden>
  <div class="modal-content onboarding-content">
    <div class="ob-stepper">
      <span class="ob-dot" id="obDot1"></span>
      <span class="ob-dot" id="obDot2"></span>
      <span class="ob-step-label" id="obStepLabel"></span>
    </div>

    <div id="obStep1">
      <h2 data-i18n="ob_title_seller"></h2>
      <p class="ob-intro" data-i18n="ob_body_seller"></p>
      <div class="menu-grid">
        <label class="full"><span data-i18n="f_company"></span>
          <input type="text" id="ob_company" autocomplete="off" data-i18n-placeholder="ob_company_placeholder">
        </label>
        <label class="half"><span data-i18n="f_vat_short"></span>
          <input type="text" id="ob_vat" autocomplete="off" placeholder="DE123456789">
        </label>
        <label class="half"><span data-i18n="f_country"></span>
          <input type="text" id="ob_country" maxlength="3" autocomplete="off" placeholder="DE">
        </label>
        <label class="full"><span data-i18n="f_iban"></span>
          <input type="text" id="ob_iban" autocomplete="off" placeholder="DE00 0000 0000 0000 0000 00">
        </label>
      </div>
      <div class="ob-actions">
        <button type="button" class="btn-panel" id="obLoadDemo" data-i18n="ob_load_demo"></button>
        <button type="button" class="btn-accent" id="obContinue" data-i18n="ob_continue"></button>
      </div>
    </div>

    <div id="obStep2" hidden>
      <h2 data-i18n="ob_title_number"></h2>
      <p class="ob-intro" data-i18n="ob_body_number"></p>
      <div class="menu-grid">
        <label class="half wide"><span data-i18n="number_setup_pattern_label"></span>
          <input type="text" id="ob_pattern" value="{yyyy}-{counter:5}" autocomplete="off">
        </label>
        <label class="half narrow"><span data-i18n="number_setup_start_label"></span>
          <input type="number" id="ob_start" min="1" step="1" value="1">
        </label>
      </div>
      <div class="token-chip-row">
        <span class="note-small" data-i18n="ob_tokens_label"></span>
        <div class="token-chips" id="obTokenChips">
          <button type="button" data-token="{yyyy}">{yyyy}</button>
          <button type="button" data-token="{mm}">{mm}</button>
          <button type="button" data-token="{counter:5}">{counter:5}</button>
        </div>
      </div>
      <div class="ob-preview">
        <div class="mini-label" data-i18n="ob_next_numbers"></div>
        <div id="obNumberPreview"></div>
      </div>
      <div class="ob-actions">
        <button type="button" class="link-muted" id="obBack" data-i18n="ob_back"></button>
        <button type="button" class="btn-accent" id="obFinish" data-i18n="ob_finish"></button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Embed-XML modal ===== -->
<div class="modal" id="embedModal" hidden>
  <div class="modal-content embed-modal-content">
    <div class="modal-head">
      <h2 data-i18n="embed_title"></h2>
      <button id="embedClose" class="modal-x" type="button" aria-label="Close">✕</button>
    </div>
    <p class="modal-intro" data-i18n="embed_intro"></p>
    <div class="drop" id="drop">
      <div data-i18n="drop_pdf"></div>
      <div class="fname" id="fname"></div>
    </div>
    <input type="file" id="file" accept="application/pdf,.pdf" class="visually-hidden">
    <div class="embed-actions">
      <button type="button" class="btn-accent" id="btnEmbedRun" data-i18n="btn_embed_run"></button>
    </div>
  </div>
</div>

<!-- ===== Past-invoice modal ===== -->
<div class="modal" id="pastInvoiceModal" hidden>
  <div class="modal-content past-invoice-content">
    <div class="modal-head">
      <h2 data-i18n="past_modal_title"></h2>
      <button id="pastCancel" class="modal-x" type="button" aria-label="Close">✕</button>
    </div>
    <p class="modal-intro" data-i18n="past_modal_hint"></p>
    <div class="modal-grid">
      <label><span data-i18n="past_field_date"></span>
        <input type="date" id="past_date">
      </label>
      <label><span data-i18n="past_field_number"></span>
        <input type="text" id="past_number" autocomplete="off">
      </label>
      <label class="full"><span data-i18n="past_field_buyer_select"></span>
        <select id="past_buyer_select" class="select-box"></select>
      </label>
      <label class="full"><span data-i18n="past_field_buyer"></span>
        <input type="text" id="past_buyer_text" autocomplete="off">
      </label>
      <label><span data-i18n="past_field_currency"></span>
        <input type="text" id="past_currency" maxlength="3" value="EUR">
      </label>
      <label><span data-i18n="past_field_total"></span>
        <input type="number" id="past_total" step="0.01" min="0">
      </label>
      <label><span data-i18n="past_field_taxmode"></span>
        <select id="past_taxmode" class="select-box">
          <option value="S" data-i18n="tax_S"></option>
          <option value="AE" data-i18n="tax_AE"></option>
          <option value="Z" data-i18n="tax_Z"></option>
          <option value="E" data-i18n="tax_E"></option>
          <option value="O" data-i18n="tax_O"></option>
        </select>
      </label>
      <label id="past_vat_rate_wrap"><span data-i18n="past_field_vat_rate"></span>
        <input type="number" id="past_vat_rate" step="1" min="0" value="20">
      </label>
      <label><span data-i18n="past_field_project"></span>
        <input type="text" id="past_project" autocomplete="off">
      </label>
      <label><span data-i18n="past_field_category"></span>
        <input type="text" id="past_category" autocomplete="off">
      </label>
    </div>
    <div class="modal-actions">
      <button id="pastSave" class="btn-accent" type="button" data-i18n="past_save"></button>
    </div>
  </div>
</div>

<!-- ===== YoY backfill modal ===== -->
<div class="modal" id="yoyBackfillModal" hidden>
  <div class="modal-content yoy-backfill-content">
    <div class="modal-head">
      <h2 data-i18n="yoy_modal_title"></h2>
      <button id="yoyBackfillCancel" class="modal-x" type="button" aria-label="Close">✕</button>
    </div>
    <p class="modal-intro" data-i18n="yoy_modal_intro"></p>

    <div class="yoy-modal-fields">
      <label class="inline">
        <span data-i18n="yoy_field_year"></span>
        <select id="yoyBackfillYear" class="select-sm"></select>
      </label>
      <label class="inline">
        <span data-i18n="yoy_field_currency"></span>
        <select id="yoyBackfillCurrency" class="select-sm"></select>
      </label>
    </div>

    <div class="yoy-month-grid">
      <label><span data-i18n="yoy_month_jan"></span><input type="number" id="yoyMonth_0" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_feb"></span><input type="number" id="yoyMonth_1" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_mar"></span><input type="number" id="yoyMonth_2" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_apr"></span><input type="number" id="yoyMonth_3" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_may"></span><input type="number" id="yoyMonth_4" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_jun"></span><input type="number" id="yoyMonth_5" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_jul"></span><input type="number" id="yoyMonth_6" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_aug"></span><input type="number" id="yoyMonth_7" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_sep"></span><input type="number" id="yoyMonth_8" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_oct"></span><input type="number" id="yoyMonth_9" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_nov"></span><input type="number" id="yoyMonth_10" step="0.01" min="0"></label>
      <label><span data-i18n="yoy_month_dec"></span><input type="number" id="yoyMonth_11" step="0.01" min="0"></label>
    </div>

    <div class="modal-actions">
      <button id="yoyBackfillSave" class="btn-accent" type="button" data-i18n="yoy_save"></button>
    </div>
  </div>
</div>

<!-- Toast host — transient feedback messages stack here, top-right. -->
<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>

<!-- Shared tooltip popover -->
<div id="tooltipPopover" class="tooltip-popover" role="tooltip" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
